[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "livescape-event-server"
version = "0.1.0"
description = "Local-first LiveScape event server: validates normalized events and broadcasts them to renderer clients."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.118",
    "pydantic>=2.11",
    "uvicorn[standard]>=0.37",
    "websockets>=15.0",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.13",
    "pytest>=8.4",
    "ruff>=0.14",
]

[project.scripts]
livescape-event-server = "livescape_event_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/livescape_event_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error",
    # Upstream deprecation churn (starlette/anyio) is not ours to fix here.
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
