site_name: LiveScape
site_description: Local-first interactive scene engine for livestreams.
site_url: https://quangshuynh.github.io/livescape/
site_author: quangshuynh

repo_url: https://github.com/quangshuynh/livescape
repo_name: quangshuynh/livescape
edit_uri: edit/main/docs/

copyright: MIT licensed.

theme:
  name: material
  logo: images/livescape-logo.png
  favicon: images/livescape-logo.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: '(prefers-color-scheme: light)'
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
    - toc.follow

extra_css:
  - stylesheets/livescape.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quick Start: quick-start.md
      - OBS Setup: obs.md
  - Concepts:
      - Architecture: architecture.md
      - Scenes and Effects: scenes-and-effects.md
  - Reference:
      - Event Protocol: protocol.md
      - Event Server API: api.md
      - Configuration: configuration.md
  - Development:
      - Repository Structure: repository-structure.md
      - Testing: testing.md
  - Project:
      - Security and Privacy: security.md
      - Roadmap: roadmap.md
